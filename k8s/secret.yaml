# Placeholder Secret. Real values are never committed - this manifest carries
# empty strings and is patched at deploy time, e.g.
#
#   kubectl create secret generic model-registry-credentials \
#     --namespace ml-training \
#     --from-literal=REGISTRY_USERNAME="$REGISTRY_USERNAME" \
#     --from-literal=REGISTRY_TOKEN="$REGISTRY_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-credentials
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
type: Opaque
stringData:
  REGISTRY_USERNAME: ""
  REGISTRY_TOKEN: ""
